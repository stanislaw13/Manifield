<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="manifield.css">
<style>
  /* The page is embedded in native cards, so it draws no ground and no margin of its own:
   * the host decides the chrome, and text lines up with the SwiftUI labels around it. */
  html, body { background: transparent; font-size: 13px; line-height: 1.5; }
  body { padding: 0; }
  #content { max-width: 820px; }
  #inner { display: flow-root; }
  #inner > :first-child { margin-top: 0; }
  #inner > :last-child { margin-bottom: 0; }
  p { margin: 0.55em 0; }
  #content.clipped {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent 100%);
  }
</style>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="render.js"></script>
</head>
<body>
<div id="content"><div id="inner"></div></div>
<script>
  const content = document.getElementById("content");
  const inner = document.getElementById("inner");
  let clipHeight = 0;
  let lastReported = -1;

  /* Swift calls this with a markdown string (JSON-encoded on the Swift side). */
  window.setDocument = function (markdown) {
    setRenderedContent(inner, renderMarkdownWithMath(markdown));
    window.scrollTo(0, 0);
    flushUndefinedMacroReport();
    applyClip();
    reportContentHeight();
  };

  /* A positive height shows only that much, fading out at the bottom, with no inner
   * scrolling — the host offers "Show more" instead. Zero shows everything. */
  window.setClip = function (height) {
    clipHeight = Math.max(0, Number(height) || 0);
    applyClip();
  };

  function applyClip() {
    const overflowing = clipHeight > 0 && inner.offsetHeight > clipHeight + 1;
    content.style.maxHeight = clipHeight > 0 ? clipHeight + "px" : "";
    content.classList.toggle("clipped", overflowing);
    document.documentElement.style.overflow = clipHeight > 0 ? "hidden" : "";
  }

  /* Lets Swift size the enclosing frame to the content instead of guessing a fixed
   * height per call site. Measured on the inner wrapper, so a clip never hides the real
   * height, and re-measured whenever the text reflows — a width change, a late font. */
  function reportContentHeight() {
    const height = Math.ceil(inner.getBoundingClientRect().height);
    if (height === lastReported) return;
    lastReported = height;
    applyClip();
    if (!window.webkit?.messageHandlers?.manifieldBridge) return;
    window.webkit.messageHandlers.manifieldBridge.postMessage({
      type: "contentHeight",
      height: height,
    });
  }
  new ResizeObserver(reportContentHeight).observe(inner);
  document.fonts.ready.then(reportContentHeight);
  window.addEventListener("load", reportContentHeight);
</script>
</body>
</html>
